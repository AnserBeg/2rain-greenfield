name: CI
on: workflow_dispatch
permissions:
  contents: read
env:
  CI: '1'
jobs:
  pdf-diagnostics:
    name: PDF issuance and renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Document renderer
        run: node --import tsx --test test/integration/document-pdf.test.ts
      - name: Template issuance
        if: always()
        run: node --import tsx --test test/postgres/document-templates.test.ts
