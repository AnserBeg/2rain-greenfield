name: CRITFIX-H baseline
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attachment-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Observe before-fix attachment tests on main
        run: |
          env -u CI node --import tsx --test --test-concurrency=1 test/integration/document-http.test.ts test/postgres/document-attachments.test.ts
