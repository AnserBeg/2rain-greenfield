name: CONNECT-1 focused diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  address:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: packet/CONNECT-1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Derive connector language coverage decisions
        run: |
          cat > /tmp/connector-coverage.mjs <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = process.cwd();
          const imported = async (path) => {
            const module = await import(`${root}/${path}`);
            return module.default ?? module;
          };
          const { deriveLanguageCoverageLedger, observeLanguageCoverage, deriveDecisionSetDigest, deriveLanguageCoverageDecisionId, encodeLanguageCoverageObservationSnapshot } = await imported('test/helpers/language-conformance-ledger.ts');
          const { languageCoverageApplicationPackages } = await imported('test/helpers/language-coverage-packages.ts');
          const { normalizeApplicationPackage } = await imported('packages/canonical-model/src/index.ts');
          const { lowerStorageTargetV1 } = await imported('packages/compiler/src/index.ts');
          const file = 'test/fixtures/g2/language-conformance/coverage-decisions.json';
          const old = JSON.parse(readFileSync(file, 'utf8'));
          const ledger = deriveLanguageCoverageLedger(root);
          const applicationPackages = languageCoverageApplicationPackages();
          const observed = observeLanguageCoverage(ledger, {
            applicationPackages,
            storageTargets: applicationPackages.map((definition) => lowerStorageTargetV1(normalizeApplicationPackage(definition))),
          });
          const observationSnapshot = encodeLanguageCoverageObservationSnapshot(ledger, observed);
          if (old.ledgerDigest === ledger.digest && JSON.stringify(old.observationSnapshot) === JSON.stringify(observationSnapshot)) console.log('The derived language inventory and observations are unchanged.');
          else {
            const decisions = old.decisions.map((entry) => {
              const { decisionId, ...body } = entry;
              body.ledgerDigest = ledger.digest;
              body.obligationSetDigest = deriveDecisionSetDigest(ledger, observed, body.category);
              body.rationale += ' CONNECT-1 admits tenant-authored Address fields and map placement. The address compiler and customization replay tests exercise them outside the first-party releases.';
              return { ...body, decisionId: deriveLanguageCoverageDecisionId(decisionId.split('@')[0], body) };
            });
            writeFileSync(file, JSON.stringify({ ...old, decisions, ledgerDigest: ledger.digest, observationSnapshot }, null, 2) + '\n');
            console.log(JSON.stringify({ previous: old.observationSnapshot.obligationCount, current: ledger.obligations.length, observed: observed.size }));
          }
          JS
          node --import tsx /tmp/connector-coverage.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-coverage
          path: test/fixtures/g2/language-conformance/coverage-decisions.json
      - name: Format changed source
        run: |
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- '*.ts' | xargs --no-run-if-empty corepack pnpm exec prettier --write
          git diff -- '*.ts' > /tmp/connector-format.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-format
          path: /tmp/connector-format.patch
      - name: Capture migration stream
        run: node --import tsx test/helpers/regenerate-schema-snapshot.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-snapshot
          path: db/schema.snapshot.json
      - run: corepack pnpm typecheck
        id: types
        continue-on-error: true
      - run: corepack pnpm lint
        id: lint
        continue-on-error: true
      - run: node --import tsx --test test/unit/address-connector.test.ts
      - run: node --import tsx --test --test-name-pattern='addAddressField and addMapPlacement replay' test/unit/customization.test.ts
        id: replay
        continue-on-error: true
      - run: node --import tsx --test test/postgres/address-connector.test.ts
      - if: always()
        run: test "${{ steps.types.outcome }}" = success && test "${{ steps.lint.outcome }}" = success
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        control: [late-address-response, shared-record-company-pin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: packet/CONNECT-1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - run: bash scripts/check-expected-red.sh --run "${{ matrix.control }}"
