name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-1-coverage:
    name: DOCS-1 coverage and focused PostgreSQL checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - run: node --import tsx .github/docs1-regenerate-coverage.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs1-coverage-decisions
          path: test/fixtures/g2/language-conformance/coverage-decisions.json
          if-no-files-found: error
      - run: env -u CI node --import tsx --test --test-concurrency=1 test/postgres/document-attachments.test.ts test/postgres/document-templates.test.ts
