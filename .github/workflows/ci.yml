name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: '1'
jobs:
  isolate:
    name: DOCS-1 expected red - ${{ matrix.control }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        control:
          - generated-pdf-source-revocation
          - generated-pdf-company-brand-source-revocation
          - documents-parse-time-pdf-bound
          - documents-pdf-process-limits
          - documents-sql-page-size
          - documents-api-demo-scanner-guard
          - documents-http-commit-outcome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2616f55a5906a38494735d87bc6e82b30c67a3b6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - env:
          CONTROL: ${{ matrix.control }}
        run: bash scripts/check-expected-red.sh --run "$CONTROL"
