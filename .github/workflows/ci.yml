name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Clean install, quality, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Check formatting
        run: corepack pnpm format
      - name: Lint
        run: corepack pnpm lint
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Build
        run: corepack pnpm build
      - name: Run unit tests
        run: corepack pnpm test:unit
      - name: Run integration tests
        run: corepack pnpm test:integration
      - name: Run architecture and hygiene tests
        run: corepack pnpm test:architecture
      - name: Check patch whitespace and repository cleanliness
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain compiled scaffold
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scaffold-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  postgres:
    name: PostgreSQL schema and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Run PostgreSQL tests
        run: corepack pnpm test:postgres

  browser:
    name: Browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: corepack pnpm test:browser

  observability:
    name: Observability evidence
    needs:
      - browser
      - postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Capture observability evidence
        env:
          OBSERVABILITY_EVIDENCE_DIR: test-results/observability
        run: |
          mkdir -p test-results/observability
          node --import tsx --test \
            test/unit/observability.test.ts \
            test/integration/observability-ci-contract.test.ts \
            test/postgres/observability-health.test.ts \
            | tee test-results/observability/tests.tap
      - name: Retain observability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observability-evidence-${{ github.sha }}
          path: test-results/observability/
          if-no-files-found: error
          retention-days: 7
