name: SIGNIN-1 targeted evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [snapshot, postgres, browser, baseline, rollback, prior, resource, approver, executor, issuer]
    env:
      CONTROL: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - if: contains(fromJSON('["browser","resource","approver","executor","issuer"]'), matrix.check)
        uses: ./.github/actions/install-chromium
      - if: matrix.check == 'snapshot'
        run: node --import tsx test/helpers/regenerate-schema-snapshot.ts
      - if: matrix.check == 'snapshot'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signin-schema
          path: db/schema.snapshot.json
      - if: matrix.check != 'snapshot'
        run: python3 .github/signin-r2-proof.py
