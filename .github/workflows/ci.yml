name: SIGNIN-1 decision proof controls
on: workflow_dispatch
permissions:
  contents: read
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        fixture: [release-approval, workflow-consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Exercise the committed regression and its four expected reds
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: node --import tsx --test "test/postgres/$FIXTURE.test.ts"
