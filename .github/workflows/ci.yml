name: CONNECT-1 Party prerequisites
on: workflow_dispatch
permissions:
  contents: read
jobs:
  posting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - run: node --import tsx --test --test-concurrency=1 --test-name-pattern='the unchanged kernel admits a posting' test/postgres/inventory-posting.test.ts
