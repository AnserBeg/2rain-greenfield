name: Regenerate WORKFLOW-1 schema snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - run: node scripts/run-with-test-lock.mjs exclusive -- node --import tsx test/helpers/regenerate-schema-snapshot.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-db-schema-snapshot
          path: db/schema.snapshot.json
