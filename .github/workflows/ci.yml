name: Board diagnostics
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  types:
    name: Board types and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - &id001
      name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - &id002
      name: Set up pinned Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .node-version
    - &id003
      name: Enable Corepack
      run: corepack enable
    - &id004
      name: Install frozen dependencies
      run: corepack pnpm install --frozen-lockfile --reporter=append-only
    - run: corepack pnpm typecheck
    - if: always()
      run: corepack pnpm lint
  compiler:
    name: Board compiler and omissions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - run: node --import tsx --test --test-name-pattern='Board revisions bind' test/unit/customization.test.ts
    - if: always()
      run: corepack pnpm check:app-release
  serving:
    name: Board archive and current reader
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - run: node --import tsx --test --test-name-pattern='preceding serving reader
        admits' test/postgres/customization-validation.test.ts
  browser:
    name: Board keyboard journey
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - uses: ./.github/actions/install-chromium
    - run: corepack pnpm exec playwright test --config apps/web/playwright.customization.config.ts
        --grep 'keyboard user moves' --reporter=list
  generated:
    name: Board formatting and coverage artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - run: 'cp test/helpers/calendar1-generate.diagnostic.txt /tmp/calendar1-generator.cjs

        git worktree add --detach /tmp/calendar1-original 2042780bcc3889022af36493a2dcaa3a62b8cb56

        (cd /tmp/calendar1-original && corepack pnpm install --offline --frozen-lockfile
        --reporter=append-only && CALENDAR_OLD_OBSERVATIONS=1 node --import tsx /tmp/calendar1-generator.cjs)

        node --import tsx /tmp/calendar1-generator.cjs'
    - run: corepack pnpm exec prettier --write apps/web/src/board.ts apps/web/src/component-registry.ts
        apps/web/src/customize-screen.ts apps/web/src/ledger-styles.ts apps/web/src/surface-contract.ts
        apps/web/src/surface-runtime.ts apps/web/src/workspace-entry.ts apps/web/test/browser/customize.composed-application.spec.ts
        apps/web/test/browser/surface-grammar.spec.ts packages/canonical-model/src/board.ts
        packages/canonical-model/src/constants.ts packages/canonical-model/src/index.ts
        packages/canonical-model/src/schemas.ts packages/canonical-model/src/surface-workspace.ts
        packages/compiler/src/projections.ts packages/customization/src/ai-draft.ts
        packages/customization/src/apply.ts packages/customization/src/board-revision.ts
        packages/customization/src/index.ts packages/customization/src/patch.ts packages/customization/src/render.ts
        packages/customization/src/targets.ts packages/dev-tooling/src/surface-grammar-conformance/index.ts
        packages/dev-tooling/src/surface-runtime-seam.ts packages/postgres-provider/src/board-admission.ts
        packages/postgres-provider/src/module-runtime-interpreter.ts packages/postgres-provider/src/release-repository.ts
        packages/postgres-provider/src/request-runtime-view-service.ts packages/runtime/src/request-runtime-view.ts
        packages/runtime/src/semantic-query-gateway.ts test/postgres/customization-validation.test.ts
        test/postgres/request-runtime-view.test.ts test/unit/customization.test.ts
        test/fixtures/g2/language-conformance/coverage-decisions.json
    - run: git diff --binary -- apps/web/src/board.ts apps/web/src/component-registry.ts
        apps/web/src/customize-screen.ts apps/web/src/ledger-styles.ts apps/web/src/surface-contract.ts
        apps/web/src/surface-runtime.ts apps/web/src/workspace-entry.ts apps/web/test/browser/customize.composed-application.spec.ts
        apps/web/test/browser/surface-grammar.spec.ts packages/canonical-model/src/board.ts
        packages/canonical-model/src/constants.ts packages/canonical-model/src/index.ts
        packages/canonical-model/src/schemas.ts packages/canonical-model/src/surface-workspace.ts
        packages/compiler/src/projections.ts packages/customization/src/ai-draft.ts
        packages/customization/src/apply.ts packages/customization/src/board-revision.ts
        packages/customization/src/index.ts packages/customization/src/patch.ts packages/customization/src/render.ts
        packages/customization/src/targets.ts packages/dev-tooling/src/surface-grammar-conformance/index.ts
        packages/dev-tooling/src/surface-runtime-seam.ts packages/postgres-provider/src/board-admission.ts
        packages/postgres-provider/src/module-runtime-interpreter.ts packages/postgres-provider/src/release-repository.ts
        packages/postgres-provider/src/request-runtime-view-service.ts packages/runtime/src/request-runtime-view.ts
        packages/runtime/src/semantic-query-gateway.ts test/postgres/customization-validation.test.ts
        test/postgres/request-runtime-view.test.ts test/unit/customization.test.ts
        test/fixtures/g2/language-conformance/coverage-decisions.json > /tmp/calendar1-generated.patch
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: calendar1-regular-generated
        path: /tmp/calendar1-generated.patch
        retention-days: 1
  architecture:
    name: Board surface architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - run: node --import tsx --test test/architecture/surface-runtime-seam.test.ts
        test/architecture/surface-grammar-conformance.test.ts
