name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  REACHABILITY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Clean install, quality, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Check formatting
        run: corepack pnpm format
      - name: Lint
        run: corepack pnpm lint
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Build
        run: corepack pnpm build
      - name: Check mutation manifests still name live production text
        run: corepack pnpm check:expected-red
      - name: Prove the expected-red gate can fail
        run: corepack pnpm check:expected-red-controls
      - name: Run unit tests
        run: corepack pnpm test:unit
      - name: Run compiler tests
        run: corepack pnpm test:compiler
      - name: Run integration tests
        run: corepack pnpm test:integration
      - name: Run agent tests
        run: corepack pnpm test:agent
      - name: Run architecture and hygiene tests
        run: corepack pnpm test:architecture
      - name: Check compiled demo release freshness
        run: corepack pnpm check:demo-release
      - name: Check compiled application release freshness
        run: corepack pnpm check:app-release
      - name: Run web surface contracts
        run: corepack pnpm test:contracts
      - name: Check language coverage obligations
        run: corepack pnpm check:language-coverage
      - name: Retain quality executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-quality-${{ github.sha }}
          path: |
            test-results/reachability/unit.json
            test-results/reachability/compiler.json
            test-results/reachability/integration.json
            test-results/reachability/agent.json
            test-results/reachability/architecture.json
            test-results/reachability/contracts.json
          if-no-files-found: error
          retention-days: 7
      - name: Check patch whitespace and repository cleanliness
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain compiled scaffold
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scaffold-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  performance:
    name: Exclusive compiler performance budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Run exclusive compiler performance gate
        run: corepack pnpm test:performance
      - name: Retain performance executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-performance-${{ github.sha }}
          path: test-results/reachability/performance.json
          if-no-files-found: error
          retention-days: 7

  postgres:
    name: PostgreSQL schema and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Check schema drift
        run: corepack pnpm check:schema
      - name: Run PostgreSQL tests
        run: corepack pnpm test:postgres
      - name: Run non-C locale determinism probe
        run: corepack pnpm test:locale
      - name: Retain PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-${{ github.sha }}
          path: test-results/reachability/postgres.json
          if-no-files-found: error
          retention-days: 7

  # The composed application replays every release in the lineage, so it runs
  # beside the other PostgreSQL tests rather than after them, under the same
  # bound.
  postgres-composed:
    name: PostgreSQL composed application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Run composed application PostgreSQL tests
        run: corepack pnpm test:postgres:composed
      - name: Retain composed PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-composed-${{ github.sha }}
          path: test-results/reachability/postgres-composed.json
          if-no-files-found: error
          retention-days: 7

  # The commercial document workflows (orders, receipts, invoices, bills)
  # install the composed release in most tests, so they run beside the other
  # PostgreSQL tests, under the same bound.
  postgres-commercial:
    name: PostgreSQL commercial workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Run commercial workflow PostgreSQL tests
        run: corepack pnpm test:postgres:commercial
      - name: Retain commercial PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-commercial-${{ github.sha }}
          path: test-results/reachability/postgres-commercial.json
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: corepack pnpm test:browser
      - name: Retain browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-${{ github.sha }}
          path: test-results/reachability/browser.json
          if-no-files-found: error
          retention-days: 7

  # Purchasing, receiving and receivables, payables and the order Lists and
  # pages run beside the Sales and platform specs rather than after them, under
  # the same bound.
  # apps/web/playwright.shared.ts decides which job runs a spec, by its file
  # name.
  browser-operations:
    name: Operations browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run operations browser tests
        run: corepack pnpm test:browser:operations
      - name: Retain operations browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-operations-${{ github.sha }}
          path: test-results/reachability/browser-operations.json
          if-no-files-found: error
          retention-days: 7

  # The inventory and item stock specs run beside the operations specs rather
  # than after them, under the same bound (INTEGRATION: the union's operations
  # specs alone passed the 20-minute bound).
  browser-inventory:
    name: Inventory browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run inventory browser tests
        run: corepack pnpm test:browser:inventory
      - name: Retain inventory browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-inventory-${{ github.sha }}
          path: test-results/reachability/browser-inventory.json
          if-no-files-found: error
          retention-days: 7

  # The composed application's journeys run beside the operations specs rather
  # than after them, under the same bound.
  browser-composed:
    name: Composed application browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run composed application browser tests
        run: corepack pnpm test:browser:composed
      - name: Retain composed application browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-composed-${{ github.sha }}
          path: test-results/reachability/browser-composed.json
          if-no-files-found: error
          retention-days: 7

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Run dependency and secret gates
        env:
          SECURITY_EVIDENCE_DIR: test-results/security
        run: .github/scripts/run-security-scans.sh
      - name: Retain security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence-${{ github.sha }}
          path: test-results/security/
          if-no-files-found: error
          retention-days: 7

  observability:
    name: Observability evidence
    needs:
      - browser
      - postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Capture observability evidence
        env:
          OBSERVABILITY_EVIDENCE_DIR: test-results/observability
        run: |
          mkdir -p test-results/observability
          node --import tsx test/helpers/run-observability-producer.ts \
            | tee test-results/observability/tests.tap
      - name: Retain observability executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-observability-${{ github.sha }}
          path: test-results/reachability/observability.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain observability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observability-evidence-${{ github.sha }}
          path: test-results/observability/
          if-no-files-found: error
          retention-days: 7

  reachability:
    name: Executed-file reachability
    needs:
      - quality
      - performance
      - postgres
      - postgres-composed
      - postgres-commercial
      - browser
      - browser-operations
      - browser-inventory
      - browser-composed
      - observability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Download executed-file evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: reachability-*-${{ github.sha }}
          path: test-results/reachability
          merge-multiple: true
      - name: Compare executed files with repository discovery
        run: corepack pnpm check:reachability
