name: CI
# GitHub assigns run-name before a diff can be read. An automatic promotion
# dispatches a named full run and propagates its exact result to the request.
run-name: CI ${{ (github.ref == 'refs/heads/main' || inputs.tier == 'full' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'full' || 'quick' }} · ${{ inputs.merge_sha || github.sha }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tier:
        description: Packet tier (quick promotes on shared or unknown changes)
        type: choice
        options: [quick, full]
        default: quick
      expected_head:
        description: Ref SHA bound by automatic promotion
        type: string
      pr_number:
        description: Pull request concurrency group for automatic promotions
        type: string
      merge_sha:
        description: Synthetic PR merge commit bound by automatic promotion
        type: string

permissions:
  contents: read

# Main runs one group per commit: every push runs full in parallel and none is
# cancelled or held behind an earlier push. Packet refs cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.merge_sha && format('pr-{0}', inputs.pr_number) || github.ref }}-${{ github.ref == 'refs/heads/main' && !inputs.merge_sha && format('sha-{0}', github.sha) || github.ref != 'refs/heads/main' && inputs.tier || 'auto' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || inputs.merge_sha != '' }}

env:
  CI: '1'
  REACHABILITY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Select CI tier and covered tests
    runs-on: ubuntu-24.04
    outputs:
      dispatch_ref: ${{ steps.select.outputs.ref }}
      dispatch_head: ${{ steps.select.outputs.head }}
      tier: ${{ steps.select.outputs.tier }}
      promote: ${{ steps.select.outputs.promote }}
      files: ${{ steps.select.outputs.files }}
      browser: ${{ steps.select.outputs.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        run: node .github/scripts/ci-selection.mjs

  promote:
    name: Run full CI on the selected commit
    needs: select
    if: needs.select.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
    steps:
      # No checkout or packet code runs with the dispatch token.
      - name: Dispatch full on the selected commit
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKET_REF: ${{ needs.select.outputs.dispatch_ref }}
          EXPECTED_HEAD: ${{ needs.select.outputs.dispatch_head }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: |
          run_id=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' -X POST "repos/$GH_REPO/actions/workflows/ci.yml/dispatches" \
            -f "ref=$PACKET_REF" -f 'inputs[tier]=full' -f "inputs[expected_head]=$EXPECTED_HEAD" \
            -f "inputs[merge_sha]=$MERGE_SHA" -f "inputs[pr_number]=$PR_NUMBER" --jq .workflow_run_id)
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Full CI: https://github.com/$GH_REPO/actions/runs/$run_id" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Follow the dispatched run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          # Dispatch may return its ID before the run is visible to GET.
          # Retry reads only. Creating another run would lose the binding.
          errors=0
          while true; do
            if state=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '[.status, .conclusion] | @tsv'); then
              errors=0
              if [[ "$state" == completed$'\t'* ]]; then
                echo "Full CI $RUN_ID: $state"
                [[ "$state" == completed$'\t'success ]]
                break
              fi
              sleep 30
            else
              errors=$((errors + 1))
              if ((errors >= 12)); then exit 1; fi
              sleep 10
            fi
          done

  postgres-composed:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: PostgreSQL composed application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      replay: ${{ steps.replay.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Run composed application PostgreSQL tests
        id: replay
        run: corepack pnpm test:postgres:composed
      - name: Retain composed PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-composed-${{ github.sha }}
          path: test-results/reachability/postgres-composed.json
          if-no-files-found: error
          retention-days: 7

  quality:
    needs: select
    if: needs.select.outputs.promote == 'false'
    name: Clean install, quality, and build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.select.outputs.tier == 'quick' && 35 || 15 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Check packet CI tier declarations
        run: node scripts/check-record-ci-tier.mjs
      - name: Check formatting
        run: corepack pnpm format
      - name: Lint
        run: corepack pnpm lint
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Build
        run: corepack pnpm build
      - name: Check mutation manifests still name live production text
        run: corepack pnpm check:expected-red
      - name: Prove the expected-red gate can fail
        run: corepack pnpm check:expected-red-controls
      - name: Run unit tests
        run: corepack pnpm test:unit
      - name: Run compiler tests
        run: corepack pnpm test:compiler
      - name: Run integration tests
        if: needs.select.outputs.tier == 'full'
        run: corepack pnpm test:integration
      - name: Run agent tests
        if: needs.select.outputs.tier == 'full'
        run: corepack pnpm test:agent
      - name: Run architecture and hygiene tests
        run: corepack pnpm test:architecture
      - name: Check compiled demo release freshness
        run: corepack pnpm check:demo-release
      - name: Check compiled application release freshness
        run: corepack pnpm check:app-release
      - name: Run web surface contracts
        if: needs.select.outputs.tier == 'full' || contains(fromJSON(needs.select.outputs.files), 'apps/web/test/surface-runtime-contract.test.ts')
        run: corepack pnpm test:contracts
      - name: Check language coverage obligations
        if: needs.select.outputs.tier == 'full'
        run: corepack pnpm check:language-coverage
      - name: Run the selected node tests
        if: needs.select.outputs.tier == 'quick'
        env:
          CI_FILES: ${{ needs.select.outputs.files }}
        run: node --import tsx .github/scripts/run-quick-node.mjs
      - name: Install Chromium for selected specs
        if: needs.select.outputs.browser == 'true'
        uses: ./.github/actions/install-chromium
      - name: Run the selected browser specs
        if: needs.select.outputs.browser == 'true'
        env:
          CI_FILES: ${{ needs.select.outputs.files }}
        run: corepack pnpm exec bash scripts/run-suite.sh quick-browser --normalize-playwright -- playwright test --config apps/web/playwright.quick.config.ts
      - name: Retain quality executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-quality-${{ github.sha }}
          path: |
            test-results/reachability/unit.json
            test-results/reachability/compiler.json
            test-results/reachability/integration.json
            test-results/reachability/agent.json
            test-results/reachability/architecture.json
            test-results/reachability/contracts.json
            test-results/reachability/quick-node.json
            test-results/reachability/quick-browser.json
          if-no-files-found: error
          retention-days: 7
      - name: Check patch whitespace and repository cleanliness
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE: ${{ inputs.merge_sha }}
        run: |
          if [[ -n "$PR_MERGE" ]]; then BASE_SHA=$(git rev-parse HEAD^1); fi
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain compiled scaffold
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scaffold-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  performance:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: Exclusive compiler performance budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Run exclusive compiler performance gate
        run: corepack pnpm test:performance
      - name: Retain performance executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-performance-${{ github.sha }}
          path: test-results/reachability/performance.json
          if-no-files-found: error
          retention-days: 7

  postgres:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: PostgreSQL schema and isolation (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Check schema drift
        if: matrix.shard == 1
        run: corepack pnpm check:schema
      - name: Run PostgreSQL shard 1
        if: matrix.shard == 1
        run: corepack pnpm test:postgres:1
      - name: Run PostgreSQL shard 2
        if: matrix.shard == 2
        run: corepack pnpm test:postgres:2
      - name: Run PostgreSQL shard 3
        if: matrix.shard == 3
        run: corepack pnpm test:postgres:3
      - name: Run PostgreSQL shard 4
        if: matrix.shard == 4
        run: corepack pnpm test:postgres:4
      - name: Run PostgreSQL shard 5
        if: matrix.shard == 5
        run: corepack pnpm test:postgres:5
      - name: Run PostgreSQL shard 6
        if: matrix.shard == 6
        run: corepack pnpm test:postgres:6
      - name: Run PostgreSQL shard 7
        if: matrix.shard == 7
        run: corepack pnpm test:postgres:7
      - name: Run non-C locale determinism probe
        if: matrix.shard == 1
        run: corepack pnpm test:locale
      - name: Retain PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-${{ matrix.shard }}-${{ github.sha }}
          path: test-results/reachability/postgres-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # The commercial document workflows (orders, receipts, invoices, bills)
  # install the composed release in most tests, so they run beside the other
  # PostgreSQL tests, under the same bound.
  postgres-commercial:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: PostgreSQL commercial workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Run commercial workflow PostgreSQL tests
        run: corepack pnpm test:postgres:commercial
      - name: Retain commercial PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-commercial-${{ github.sha }}
          path: test-results/reachability/postgres-commercial.json
          if-no-files-found: error
          retention-days: 7

  # The sales-side workflows run beside the commercial ones rather than after
  # them, under the same bound (INTEGRATION).
  postgres-sales:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: PostgreSQL sales workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Run sales workflow PostgreSQL tests
        run: corepack pnpm test:postgres:sales
      - name: Retain sales PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-sales-${{ github.sha }}
          path: test-results/reachability/postgres-sales.json
          if-no-files-found: error
          retention-days: 7

  # The inventory files run beside the other PostgreSQL tests rather than after
  # them, under the same bound (INTEGRATION).
  postgres-inventory:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: PostgreSQL inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Run inventory PostgreSQL tests
        run: corepack pnpm test:postgres:inventory:balances
      - name: Retain inventory PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-inventory-${{ github.sha }}
          path: test-results/reachability/postgres-inventory.json
          if-no-files-found: error
          retention-days: 7

  postgres-inventory-posting:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: PostgreSQL inventory posting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Run inventory PostgreSQL tests
        run: corepack pnpm test:postgres:inventory:posting
      - name: Retain inventory PostgreSQL executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-postgres-inventory-posting-${{ github.sha }}
          path: test-results/reachability/postgres-inventory-posting.json
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: Browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
      - name: Run browser tests
        run: corepack pnpm test:browser
      - name: Retain browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-${{ github.sha }}
          path: test-results/reachability/browser.json
          if-no-files-found: error
          retention-days: 7

  # Purchasing, receiving and receivables, payables and the order Lists and
  # pages run beside the Sales and platform specs rather than after them, under
  # the same bound.
  # apps/web/playwright.shared.ts decides which job runs a spec, by its file
  # name.
  browser-operations:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: Operations browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
      - name: Run operations browser tests
        run: corepack pnpm test:browser:operations
      - name: Retain operations browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-operations-${{ github.sha }}
          path: test-results/reachability/browser-operations.json
          if-no-files-found: error
          retention-days: 7

  # The inventory and item stock specs run beside the operations specs rather
  # than after them, under the same bound (INTEGRATION: the union's operations
  # specs alone passed the 20-minute bound).
  browser-inventory:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: Inventory browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
      - name: Run inventory browser tests
        run: corepack pnpm test:browser:inventory
      - name: Retain inventory browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-inventory-${{ github.sha }}
          path: test-results/reachability/browser-inventory.json
          if-no-files-found: error
          retention-days: 7

  # The composed journeys include release promotion, recovery, and replay.
  browser-composed:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: Composed application browser runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
      - name: Run composed application browser tests
        run: corepack pnpm test:browser:composed
        env:
          # LOOK-1's proof writes the seven Ledger screens here.
          LOOK_EVIDENCE_OUT: ${{ github.workspace }}/test-results/look-evidence
      - name: Retain the Ledger screenshots (LOOK-1)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: look-evidence-${{ github.sha }}
          path: test-results/look-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain composed application browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-composed-${{ github.sha }}
          path: test-results/reachability/browser-composed.json
          if-no-files-found: error
          retention-days: 7

  browser-customization:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: Customization browser runner
    runs-on: ubuntu-24.04
    # Main's last five greens took 12.2-12.6 minutes. On a slow runner the
    # same six tests took 16.5 and Chromium's system deps 3.1 (20.2 in all).
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
      - name: Run customization browser tests
        run: corepack pnpm test:browser:customization
      - name: Retain customization browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-customization-${{ github.sha }}
          path: test-results/reachability/browser-customization.json
          if-no-files-found: error
          retention-days: 7

  browser-rules:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: Customization rules browser runner
    runs-on: ubuntu-24.04
    # Main's slowest green was 17.9 minutes, 7.5 of them installing Chromium.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
      - name: Run customization rules browser tests
        run: corepack pnpm test:browser:rules
      - name: Retain customization rules browser executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-browser-rules-${{ github.sha }}
          path: test-results/reachability/browser-rules.json
          if-no-files-found: error
          retention-days: 7

  security:
    needs: select
    if: needs.select.outputs.promote == 'false'
    name: Dependency and secret scans (${{ matrix.history }})
    strategy:
      fail-fast: false
      matrix:
        history: [ancestry, remainder]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Run dependency and secret gates
        env:
          SECURITY_EVIDENCE_DIR: test-results/security
          SECURITY_HISTORY_SCOPE: ${{ matrix.history }}
        run: .github/scripts/run-security-scans.sh
      - name: Retain security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence-${{ matrix.history }}-${{ github.sha }}
          path: test-results/security/
          if-no-files-found: error
          retention-days: 7

  observability:
    needs: select
    if: needs.select.outputs.promote == 'false' && needs.select.outputs.tier == 'full'
    name: Observability evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Capture observability evidence
        env:
          OBSERVABILITY_EVIDENCE_DIR: test-results/observability
        run: |
          mkdir -p test-results/observability
          node --import tsx test/helpers/run-observability-producer.ts \
            | tee test-results/observability/tests.tap
      - name: Retain observability executed-file evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachability-observability-${{ github.sha }}
          path: test-results/reachability/observability.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain observability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observability-evidence-${{ github.sha }}
          path: test-results/observability/
          if-no-files-found: error
          retention-days: 7

  reachability:
    name: Executed-file reachability (${{ needs.select.outputs.tier }} ${{ inputs.merge_sha || github.sha }})
    if: ${{ !cancelled() && needs.select.outputs.promote != 'true' }}
    env:
      CI_TIER: ${{ needs.select.outputs.tier }}
      CI_FILES: ${{ needs.select.outputs.files }}
    needs:
      - select
      - promote
      - security
      - quality
      - performance
      - postgres
      - postgres-composed
      - postgres-commercial
      - postgres-sales
      - postgres-inventory
      - postgres-inventory-posting
      - browser
      - browser-operations
      - browser-inventory
      - browser-composed
      - browser-customization
      - browser-rules
      - observability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Check required job conclusions
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node --import tsx .github/scripts/check-ci-results.mjs
      - name: Verify the tested commit
        env:
          TESTED_SHA: ${{ inputs.merge_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Begin executed-file evidence run
        run: node --import tsx test/helpers/begin-reachability-run.ts
      - name: Download executed-file evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: reachability-*-${{ github.sha }}
          path: test-results/reachability
          merge-multiple: true
      - name: Compare executed files with repository discovery
        run: corepack pnpm check:reachability
      - name: Summarize test file timings
        run: node --import tsx .github/scripts/report-ci-timings.mjs
