name: Analysis fixture
on:
  push:
    branches: [packet/ANALYZE-1-s1a, main]
    paths: ['analysis/**', '.github/workflows/analysis-fixture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rootless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Provision a separate rootless daemon on this ephemeral runner
        run: |
          set -euxo pipefail
          if ! command -v newuidmap || ! command -v dockerd-rootless-setuptool.sh; then
            curl --fail --silent --show-error https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/docker.asc"
            test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/docker.asc" | awk -F: '$1 == "fpr" { print $10; exit }')" = 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
            sudo install -m 0644 "$RUNNER_TEMP/docker.asc" /etc/apt/keyrings/docker.asc
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/analysis-docker.list
            sudo apt-get update
            sudo apt-get install -y uidmap docker-ce docker-ce-cli containerd.io docker-ce-rootless-extras
          fi
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          sudo systemctl set-property --runtime "user@$(id -u).service" Delegate="cpu cpuset io memory pids"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user start analysis.slice
          systemctl --user set-property --runtime analysis.slice MemorySwapMax=0
          dockerd-rootless-setuptool.sh install --force
          systemctl --user start docker
          python3 analysis/runner/runtime.py
      - run: python3 -B -m unittest discover -s analysis/tests
      - name: Measure limits and run discriminating controls serially
        run: python3 -u analysis/tests/spike.py
