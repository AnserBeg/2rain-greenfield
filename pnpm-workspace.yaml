packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

overrides:
  # GHSA-6j4f-fj2g-mc7p (patched 5.0.10) and GHSA-qhr7-859c-m2p7 (patched
  # 5.0.11) — stack exhaustion on nested brace groups. Dev-only reach (eslint ->
  # minimatch). Pinned exactly, as before, to the last patch of the 5.0 line.
  brace-expansion: 5.0.12
  # GHSA-5p4m-2wfm-xmqj / CVE-2026-59870 — quadratic CPU in !!omap resolution,
  # patched from 4.3.1. GHSA-2883-xcg3-v3hh then reached 4.3.1 itself and is
  # patched in 4.3.2, so the floor moves rather than the bound.
  # Dev-only reach (eslint / typescript-eslint). Held inside the 4.x major
  # deliberately: a bare '>=4.3.2' resolves to 5.2.3, and a major bump of
  # eslint's YAML config loader is a wider change than either advisory asks for.
  js-yaml: '>=4.3.2 <5'
